# Produção (Render): PostgreSQL via variáveis de ambiente.
# As demais configurações vêm do application.properties; aqui ficam só as que mudam em produção.
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Produção usa HTTPS: cookie de sessão com Secure. A Vercel repassa /api ao backend, então o cookie é do mesmo
# site e o SameSite=Lax padrão basta.
sdpp.cookie.secure=${SDPP_COOKIE_SECURE:true}
