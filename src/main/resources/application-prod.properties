# Produção: PostgreSQL. Exemplo de DATABASE_URL: jdbc:postgresql://host:5432/sdpp
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
sdpp.seed.demo=${SDPP_SEED_DEMO:false}
# Sem valor padrão: em produção a aplicação não sobe sem um segredo próprio.
sdpp.jwt.secret=${SDPP_JWT_SECRET}
