# Produção: PostgreSQL
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=update

# Seed
sdpp.seed.demo=${SDPP_SEED_DEMO:false}

# JWT
sdpp.jwt.secret=${SDPP_JWT_SECRET}
sdpp.jwt.expiracao-horas=8
# A Vercel repassa /api ao backend: o cookie é do mesmo site, então SameSite=Lax basta.
sdpp.cookie.secure=${SDPP_COOKIE_SECURE:true}
sdpp.cookie.same-site=${SDPP_COOKIE_SAMESITE:Lax}

spring.application.name=sdpp-backend
server.port=${PORT:8080}
