# Desenvolvimento: H2 em arquivo (./data), sem instalar nada.
spring.datasource.url=jdbc:h2:file:./data/sdpp;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.username=sa
spring.datasource.password=

# Valores só para uso local
sdpp.jwt.secret=${SDPP_JWT_SECRET:dev-apenas-local-troque-em-producao-0123456789}
sdpp.seed.demo=${SDPP_SEED_DEMO:true}
