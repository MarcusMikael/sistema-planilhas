spring.application.name=sdpp-backend
# Perfil padrão: dev (H2 em arquivo). Em produção use SPRING_PROFILES_ACTIVE=prod.
spring.profiles.default=dev
server.port=${PORT:8080}

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=update

# Segredos e origens vêm de variáveis de ambiente; os valores padrão servem só para desenvolvimento.
sdpp.jwt.secret=${SDPP_JWT_SECRET:dev-apenas-local-troque-em-producao-0123456789}
sdpp.jwt.expiracao-horas=8
sdpp.cors.origens=${SDPP_CORS_ORIGENS:http://localhost:5173,http://127.0.0.1:5173}

# Faixas para sugerir o nível de desempenho da Nine Box a partir da média do gestor (PA-03).
# média < limite-medio -> BAIXO; < limite-alto -> MEDIO; senão ALTO.
sdpp.ninebox.limite-medio=2.5
sdpp.ninebox.limite-alto=3.75

# Mínimo de respostas para exibir resultados agregados de clima (RN-06, PA-06).
sdpp.clima.minimo-respostas=5

sdpp.seed.demo=${SDPP_SEED_DEMO:true}
