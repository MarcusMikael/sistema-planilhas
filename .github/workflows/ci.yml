# Testes automáticos: rodam em todo pull request e em cada push na main.
# Para impedir merge com falha, o dono do repositório ativa em Settings → Branches uma regra para a main
# exigindo os checks "Backend", "Frontend" e "Ponta a ponta".
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Testes (JUnit, H2 em memória)
        run: ./mvnw -B test

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Lint (ESLint)
        run: npm run lint
      - name: Testes (Vitest)
        run: npm test
      - name: Build
        run: npm run build

  ponta-a-ponta:
    name: Ponta a ponta
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Empacota o backend
        run: ./mvnw -B -DskipTests package
      - name: Sobe o backend com os dados de demonstração (H2 em memória)
        run: |
          java -Dspring.datasource.url="jdbc:h2:mem:e2e;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1" \
               -jar target/sdpp-backend-0.0.1-SNAPSHOT.jar > backend.log 2>&1 &
          # A porta abre antes de o seed terminar: espera a saúde e depois o login de demonstração
          for i in $(seq 1 90); do
            if curl -sf -X POST localhost:8080/api/auth/login -H 'Content-Type: application/json' \
                 -d '{"email":"rh@sdpp.local","senha":"sdpp123"}' > /dev/null; then exit 0; fi
            sleep 2
          done
          echo "O backend não ficou pronto"; cat backend.log; exit 1
      - name: Roteiro ponta a ponta (scripts/e2e-api.mjs)
        run: node scripts/e2e-api.mjs http://localhost:8080
      - name: Log do backend em caso de falha
        if: failure()
        run: tail -n 200 backend.log
